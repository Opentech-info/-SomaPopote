<!DOCTYPE html>
<html lang="sw-TZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SomaPopote - Jisajili</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #28a745;
            --accent-color: #ffc107;
            --text-dark: #333;
            --text-light: #fff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 1000px;
            display: flex;
            min-height: 600px;
        }

        .register-image {
            flex: 1;
            background: url('https://picsum.photos/seed/education2/600/600.jpg') center/cover;
            position: relative;
        }

        .register-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 123, 255, 0.8), rgba(40, 167, 69, 0.8));
        }

        .register-form {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
        }

        .brand-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo i {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .brand-logo h2 {
            color: var(--text-dark);
            font-weight: bold;
            margin: 0;
        }

        .form-floating {
            margin-bottom: 15px;
        }

        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }

        .btn-register {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            color: white;
            transition: all 0.3s ease;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.4);
        }

        .user-type-selector {
            display: flex;
            margin-bottom: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 5px;
        }

        .user-type-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .user-type-btn.active {
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            color: var(--primary-color);
            font-weight: bold;
        }

        .form-steps {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .step {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
            font-weight: bold;
            color: #666;
            position: relative;
        }

        .step.active {
            background: var(--primary-color);
            color: white;
        }

        .step.completed {
            background: var(--secondary-color);
            color: white;
        }

        .step::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 100%;
            width: 20px;
            height: 2px;
            background: #e9ecef;
            transform: translateY(-50%);
        }

        .step:last-child::after {
            display: none;
        }

        .step.completed::after {
            background: var(--secondary-color);
        }

        .register-footer {
            text-align: center;
            margin-top: 20px;
        }

        .register-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .register-footer a:hover {
            text-decoration: underline;
        }

        .alert {
            border-radius: 10px;
            border: none;
            margin-bottom: 20px;
        }

        .password-strength {
            margin-top: 5px;
            height: 5px;
            border-radius: 3px;
            background: #e9ecef;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            transition: all 0.3s ease;
            border-radius: 3px;
        }

        .strength-weak { background: #dc3545; width: 33%; }
        .strength-medium { background: #ffc107; width: 66%; }
        .strength-strong { background: #28a745; width: 100%; }

        .terms-checkbox {
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .terms-checkbox a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .terms-checkbox a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .register-container {
                flex-direction: column;
                max-width: 400px;
                margin: 20px;
            }

            .register-image {
                min-height: 200px;
            }

            .register-form {
                padding: 30px 20px;
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="register-container fade-in">
        <div class="register-image"></div>
        <div class="register-form">
            <div class="brand-logo">
                <i class="fas fa-graduation-cap"></i>
                <h2>SomaPopote</h2>
                <p class="text-muted">Jisajili kuanza Kujifunza</p>
            </div>

            {% if error %}
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-triangle"></i> {{ error }}
            </div>
            {% endif %}

            {% if success %}
            <div class="alert alert-success">
                <i class="fas fa-check-circle"></i> {{ success }}
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('register') }}" id="registerForm">
                <div class="user-type-selector">
                    <button type="button" class="user-type-btn active" data-type="student">
                        <i class="fas fa-user-graduate"></i> Mwanafunzi
                    </button>
                    <button type="button" class="user-type-btn" data-type="teacher">
                        <i class="fas fa-chalkboard-teacher"></i> Mwalimu
                    </button>
                </div>

                <input type="hidden" name="user_type" id="userType" value="student">

                <div class="form-steps">
                    <div class="step active" data-step="1">1</div>
                    <div class="step" data-step="2">2</div>
                    <div class="step" data-step="3">3</div>
                </div>

                <!-- Step 1: Basic Information -->
                <div class="form-section active" id="step1">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="fullName" name="full_name" 
                               placeholder="Jina Kamili" required>
                        <label for="fullName">
                            <i class="fas fa-user"></i> Jina Kamili
                        </label>
                    </div>

                    <div class="form-floating">
                        <input type="text" class="form-control" id="phoneInput" name="phone_number" 
                               placeholder="Namba ya Simu" required>
                        <label for="phoneInput">
                            <i class="fas fa-phone"></i> Namba ya Simu
                        </label>
                    </div>

                    <div class="form-floating">
                        <input type="email" class="form-control" id="emailInput" name="email" 
                               placeholder="Barua Pepe (Hiari)">
                        <label for="emailInput">
                            <i class="fas fa-envelope"></i> Barua Pepe (Hiari)
                        </label>
                    </div>

                    <div class="form-floating">
                        <input type="password" class="form-control" id="passwordInput" name="password" 
                               placeholder="Neno la Siri" required>
                        <label for="passwordInput">
                            <i class="fas fa-lock"></i> Neno la Siri
                        </label>
                        <div class="password-strength">
                            <div class="password-strength-bar" id="strengthBar"></div>
                        </div>
                    </div>

                    <div class="form-floating">
                        <input type="password" class="form-control" id="confirmPasswordInput" name="confirm_password" 
                               placeholder="Thibitisha Neno la Siri" required>
                        <label for="confirmPasswordInput">
                            <i class="fas fa-lock"></i> Thibitisha Neno la Siri
                        </label>
                    </div>
                </div>

                <!-- Step 2: Additional Information -->
                <div class="form-section" id="step2">
                    <div class="student-fields">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="schoolInput" name="school" 
                                   placeholder="Shule">
                            <label for="schoolInput">
                                <i class="fas fa-school"></i> Shule
                            </label>
                        </div>

                        <div class="form-floating">
                            <select class="form-control" id="gradeInput" name="grade">
                                <option value="">Chagua Darasa</option>
                                <option value="Grade 1">Grade 1</option>
                                <option value="Grade 2">Grade 2</option>
                                <option value="Grade 3">Grade 3</option>
                                <option value="Grade 4">Grade 4</option>
                                <option value="Grade 5">Grade 5</option>
                                <option value="Grade 6">Grade 6</option>
                                <option value="Grade 7">Grade 7</option>
                            </select>
                            <label for="gradeInput">
                                <i class="fas fa-graduation-cap"></i> Darasa
                            </label>
                        </div>

                        <div class="form-floating">
                            <input type="text" class="form-control" id="parentPhoneInput" name="parent_phone" 
                                   placeholder="Namba ya Simu ya Mzazi (Hiari)">
                            <label for="parentPhoneInput">
                                <i class="fas fa-phone-alt"></i> Namba ya Simu ya Mzazi (Hiari)
                            </label>
                        </div>
                    </div>

                    <div class="teacher-fields" style="display: none;">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="teacherSchoolInput" name="teacher_school" 
                                   placeholder="Shule">
                            <label for="teacherSchoolInput">
                                <i class="fas fa-school"></i> Shule
                            </label>
                        </div>

                        <div class="form-floating">
                            <select class="form-control" id="subjectInput" name="subject">
                                <option value="">Chagua Somo</option>
                                <option value="Hisabati">Hisabati</option>
                                <option value="Sayansi">Sayansi</option>
                                <option value="Kiswahili">Kiswahili</option>
                                <option value="English">English</option>
                                <option value="Maadili">Maadili</option>
                                <option value="Historia">Historia</option>
                            </select>
                            <label for="subjectInput">
                                <i class="fas fa-book"></i> Somo Kuu
                            </label>
                        </div>

                        <div class="form-floating">
                            <input type="text" class="form-control" id="experienceInput" name="experience" 
                                   placeholder="Uzoefu (Miaka)">
                            <label for="experienceInput">
                                <i class="fas fa-calendar-alt"></i> Uzoefu (Miaka)
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Step 3: Terms and Conditions -->
                <div class="form-section" id="step3">
                    <div class="terms-checkbox">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="termsCheck" required>
                            <label class="form-check-label" for="termsCheck">
                                Nimesoma nakubali <a href="#">Masharti na Vigezo</a>
                            </label>
                        </div>
                    </div>

                    <div class="terms-checkbox">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="privacyCheck" required>
                            <label class="form-check-label" for="privacyCheck">
                                Nimekubali <a href="#">Sera ya Faragha</a>
                            </label>
                        </div>
                    </div>

                    <div class="terms-checkbox">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="smsCheck">
                            <label class="form-check-label" for="smsCheck">
                                Napenda kupokea taarifa na matukio kupitia SMS
                            </label>
                        </div>
                    </div>

                    <div class="terms-checkbox">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="newsletterCheck">
                            <label class="form-check-label" for="newsletterCheck">
                                Napenda kupokea jarida letu la kila wiki
                            </label>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <button type="button" class="btn btn-outline-secondary" id="prevBtn" style="display: none;">
                        <i class="fas fa-arrow-left"></i> Rudi
                    </button>
                    <button type="button" class="btn btn-primary" id="nextBtn">
                        Endelea <i class="fas fa-arrow-right"></i>
                    </button>
                    <button type="submit" class="btn btn-register" id="submitBtn" style="display: none;">
                        <i class="fas fa-user-plus"></i> Jisajili Sasa
                    </button>
                </div>
            </form>

            <div class="register-footer">
                <p>Unayo akaunti? <a href="{{ url_for('login') }}">Ingia Sasa</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let currentStep = 1;
            const totalSteps = 3;

            // User type selection
            const userTypeButtons = document.querySelectorAll('.user-type-btn');
            const userTypeInput = document.getElementById('userType');
            const studentFields = document.querySelector('.student-fields');
            const teacherFields = document.querySelector('.teacher-fields');

            userTypeButtons.forEach(button => {
                button.addEventListener('click', function() {
                    userTypeButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    userTypeInput.value = this.getAttribute('data-type');

                    // Show/hide relevant fields
                    if (this.getAttribute('data-type') === 'student') {
                        studentFields.style.display = 'block';
                        teacherFields.style.display = 'none';
                    } else {
                        studentFields.style.display = 'none';
                        teacherFields.style.display = 'block';
                    }
                });
            });

            // Phone number formatting
            const phoneInput = document.getElementById('phoneInput');
            phoneInput.addEventListener('input', function() {
                let value = this.value.replace(/\D/g, '');
                if (value.startsWith('255') && value.length > 9) {
                    this.value = '+' + value;
                } else if (value.startsWith('0') && value.length > 9) {
                    this.value = '+255' + value.substring(1);
                } else if (value.length > 0 && !value.startsWith('+')) {
                    this.value = '+' + value;
                }
            });

            // Parent phone formatting
            const parentPhoneInput = document.getElementById('parentPhoneInput');
            if (parentPhoneInput) {
                parentPhoneInput.addEventListener('input', function() {
                    let value = this.value.replace(/\D/g, '');
                    if (value.startsWith('255') && value.length > 9) {
                        this.value = '+' + value;
                    } else if (value.startsWith('0') && value.length > 9) {
                        this.value = '+255' + value.substring(1);
                    } else if (value.length > 0 && !value.startsWith('+')) {
                        this.value = '+' + value;
                    }
                });
            }

            // Password strength checker
            const passwordInput = document.getElementById('passwordInput');
            const strengthBar = document.getElementById('strengthBar');

            passwordInput.addEventListener('input', function() {
                const password = this.value;
                let strength = 0;

                if (password.length >= 8) strength++;
                if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
                if (password.match(/[0-9]/)) strength++;
                if (password.match(/[^a-zA-Z0-9]/)) strength++;

                strengthBar.className = 'password-strength-bar';
                if (strength <= 1) {
                    strengthBar.classList.add('strength-weak');
                } else if (strength === 2) {
                    strengthBar.classList.add('strength-medium');
                } else {
                    strengthBar.classList.add('strength-strong');
                }
            });

            // Form navigation
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const submitBtn = document.getElementById('submitBtn');

            function showStep(step) {
                // Hide all sections
                document.querySelectorAll('.form-section').forEach(section => {
                    section.classList.remove('active');
                });

                // Show current section
                document.getElementById(`step${step}`).classList.add('active');

                // Update step indicators
                document.querySelectorAll('.step').forEach((stepEl, index) => {
                    stepEl.classList.remove('active', 'completed');
                    if (index + 1 < step) {
                        stepEl.classList.add('completed');
                    } else if (index + 1 === step) {
                        stepEl.classList.add('active');
                    }
                });

                // Update buttons
                prevBtn.style.display = step === 1 ? 'none' : 'block';
                nextBtn.style.display = step === totalSteps ? 'none' : 'block';
                submitBtn.style.display = step === totalSteps ? 'block' : 'none';
            }

            nextBtn.addEventListener('click', function() {
                if (validateCurrentStep()) {
                    currentStep++;
                    showStep(currentStep);
                }
            });

            prevBtn.addEventListener('click', function() {
                currentStep--;
                showStep(currentStep);
            });

            function validateCurrentStep() {
                const currentSection = document.getElementById(`step${currentStep}`);
                const requiredFields = currentSection.querySelectorAll('[required]');
                let isValid = true;

                requiredFields.forEach(field => {
                    if (!field.value.trim()) {
                        field.classList.add('is-invalid');
                        isValid = false;
                    } else {
                        field.classList.remove('is-invalid');
                    }
                });

                // Special validations
                if (currentStep === 1) {
                    const password = document.getElementById('passwordInput').value;
                    const confirmPassword = document.getElementById('confirmPasswordInput').value;

                    if (password !== confirmPassword) {
                        document.getElementById('confirmPasswordInput').classList.add('is-invalid');
                        alert('Maneno ya siri hayafanani!');
                        isValid = false;
                    }

                    if (password.length < 6) {
                        document.getElementById('passwordInput').classList.add('is-invalid');
                        alert('Neno la siri lazima liwe na angalau herufi 6!');
                        isValid = false;
                    }
                }

                return isValid;
            }

            // Form submission
            document.getElementById('registerForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                if (validateCurrentStep()) {
                    const submitBtn = document.getElementById('submitBtn');
                    const originalText = submitBtn.innerHTML;
                    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Inasajili...';
                    submitBtn.disabled = true;

                    // Simulate form submission
                    setTimeout(() => {
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                        alert('Usajili umefanikiwa! Tafadhali ingia kwenye akaunti yako.');
                        window.location.href = '{{ url_for("login") }}';
                    }, 2000);
                }
            });

            // Initialize first step
            showStep(1);
        });
    </script>
</body>
</html>
